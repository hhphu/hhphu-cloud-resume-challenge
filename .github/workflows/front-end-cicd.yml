name: Deploy portfolio changes to S3 bucket

on: 
  push: 
    branches:
      - main

jobs: 
  build: 
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4

    - name: checkout mini-portfolio repo
      uses: actions/checkout@v4
      with: 
        repository: hhphu/mini-portfolio
        token: ${{ secrets.MINI_PORTFOLIO_ACCESS }}
        path: mini-portfolio

    - name: Install dependencies
      working-directory: mini-portfolio
      run: npm install

    - name: Build Website
      working-directory: mini-portfolio
      run: npm run build

    - name: Set AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: 'us-west-2'
        
    - name: Copy to S3
      working-directory: mini-portfolio
      run: aws s3 sync ./build/. s3://hhphu.com
